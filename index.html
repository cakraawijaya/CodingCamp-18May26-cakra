<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-Life Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
      <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
        <i class="fa-solid fa-gauge-high text-blue-500 text-xl"></i>
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">Todo-Life Dashboard</h1>
      </div>
    </header>

    <!-- Main grid -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 max-w-4xl mx-auto mt-6 pb-12">

      <!-- ── Greeting Widget ── -->
      <section id="greeting" class="card">
        <h2 class="section-title">
          <i class="fa-regular fa-sun text-amber-400"></i>
          Greeting
        </h2>
        <div class="flex flex-col items-center justify-center py-4 gap-1">
          <p id="time" class="text-5xl font-mono font-bold text-slate-800 tabular-nums">00:00</p>
          <p id="date" class="text-sm text-slate-500 mt-1">Loading…</p>
          <p id="greeting-text" class="text-2xl font-semibold text-blue-600 mt-3">Hello!</p>
        </div>
      </section>

      <!-- ── Focus Timer ── -->
      <section id="focus-timer" class="card">
        <h2 class="section-title">
          <i class="fa-regular fa-clock text-rose-400"></i>
          Focus Timer
        </h2>
        <div class="flex flex-col items-center gap-5 py-4">
          <div id="timer-display" class="text-6xl font-mono font-bold text-slate-800 tabular-nums">
            25:00
          </div>
          <div class="flex gap-3">
            <button id="btn-start" class="btn btn-green">
              <i class="fa-solid fa-play"></i> Start
            </button>
            <button id="btn-stop" class="btn btn-amber hidden">
              <i class="fa-solid fa-pause"></i> Stop
            </button>
            <button id="btn-reset" class="btn btn-slate">
              <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
          </div>
          <p id="timer-status" class="text-xs text-slate-400 italic">Ready to focus</p>
        </div>
      </section>

      <!-- ── To-Do List ── -->
      <section id="todo-list" class="card md:col-span-2">
        <h2 class="section-title">
          <i class="fa-solid fa-list-check text-violet-400"></i>
          To-Do List
        </h2>

        <!-- Add task form -->
        <form id="add-task-form" class="flex gap-2 mb-2" novalidate>
          <input
            id="task-input"
            type="text"
            placeholder="Add a new task…"
            class="input flex-1"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-blue">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">Add</span>
          </button>
        </form>
        <p id="task-error" class="text-red-500 text-sm mb-3 hidden">
          <i class="fa-solid fa-circle-exclamation mr-1"></i>Task description cannot be empty.
        </p>

        <!-- Task list -->
        <ul id="task-list" class="flex flex-col gap-2"></ul>
      </section>

      <!-- ── Quick Links ── -->
      <section id="quick-links" class="card md:col-span-2">
        <h2 class="section-title">
          <i class="fa-solid fa-link text-teal-400"></i>
          Quick Links
        </h2>

        <!-- Add link form -->
        <form id="add-link-form" class="flex flex-col sm:flex-row gap-2 mb-2" novalidate>
          <input
            id="link-label-input"
            type="text"
            placeholder="Label (e.g. GitHub)"
            class="input flex-1"
            autocomplete="off"
          />
          <input
            id="link-url-input"
            type="text"
            placeholder="URL (e.g. github.com)"
            class="input flex-1"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-blue">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">Add</span>
          </button>
        </form>
        <p id="link-error" class="text-red-500 text-sm mb-3 hidden">
          <i class="fa-solid fa-circle-exclamation mr-1"></i>Both label and URL are required.
        </p>

        <!-- Links container -->
        <div id="links-container" class="flex flex-wrap gap-2"></div>
      </section>

    </main>

    <!-- Toast notification -->
    <div
      id="toast"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-5 py-3 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"
    ></div>

    <script src="js/app.js" defer></script>
  </body>
</html>
